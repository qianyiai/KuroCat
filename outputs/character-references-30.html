const doc=JSON.parse(document.getElementById("catalog").textContent),byKey=new Map(doc.catalog.map(x=>[x.key,x]));
const frame=document.getElementById("pictures"),storageKey="kurocat-character-candidates-round6-v1";
let selected=new Set(doc.catalog.filter(x=>x.userApproved).map(x=>x.key)),current=doc.groups[0],onlySelected=false,storageAvailable=true;
try{const saved=JSON.parse(localStorage.getItem(storageKey));if(Array.isArray(saved))selected=new Set(saved.filter(x=>byKey.has(x)));}catch{storageAvailable=false;}

 const people=new Set([...selected].map(k=>byKey.get(k).character));

 document.getElementById("person-title").textContent=`${current.character} · ${current.count} 张候选 · 本轮新增 ${current.newCount} 张`;

 if(current.userProvidedCount)document.getElementById("person-note").textContent+=` 另有你提供的 ${current.userProvidedCount} 张候选，原始发布页待核，不计为新搜索所得。`;
 document.getElementById("filter").textContent=onlySelected?"显示全部候选":"只看已选";
 document.getElementById("filter").setAttribute("aria-pressed",String(onlySelected));
 document.getElementById("notice").textContent=storageAvailable?"选择会在当前浏览器保存；切换人物后也会保留。选完统一导出清单。":"当前窗口无法保存，请在离开前导出选择清单。";
 sendState();
}
function save(){try{localStorage.setItem(storageKey,JSON.stringify([...selected]));storageAvailable=true;}catch{storageAvailable=false;}}
addEventListener("message",e=>{
 if(e.source!==frame.contentWindow||e.data?.channel!=="kurocat-candidates-v1")return;
 if(e.data.type==="ready")sendState();
 if(e.data.type==="height"&&Number.isFinite(e.data.height))frame.style.height=Math.max(200,Math.min(40000,e.data.height+5))+"px";
 if(e.data.type==="toggle"&&byKey.has(e.data.key)&&byKey.get(e.data.key).character===current.character){selected.has(e.data.key)?selected.delete(e.data.key):selected.add(e.data.key);save();render();}
});
document.addEventListener("click",e=>{const b=e.target.closest("[data-character]");if(!b)return;current=doc.groups.find(x=>x.character===b.dataset.character);frame.src="character-references-30/"+current.slug;render();});
document.getElementById("filter").addEventListener("click",()=>{onlySelected=!onlySelected;render();});
const dialog=document.getElementById("export-dialog"),text=document.getElementById("export-text");
document.getElementById("export").addEventListener("click",()=>{text.value=JSON.stringify({schemaVersion:1,exportedAt:new Date().toISOString(),selectedCount:selected.size,references:doc.catalog.filter(x=>selected.has(x.key))},null,2);dialog.showModal();});
document.getElementById("close").addEventListener("click",()=>dialog.close());
document.getElementById("copy").addEventListener("click",async e=>{try{await navigator.clipboard.writeText(text.value);e.target.textContent="已复制";}catch{text.focus();text.select();e.target.textContent="请按 Ctrl+C 复制";}});
document.getElementById("download").addEventListener("click",()=>{const url=URL.createObjectURL(new Blob([text.value],{type:"application/json;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="kurocat-character-selections-round6.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);});
frame.src="character-references-30/"+current.slug;render();
</script></html>
