<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>大肥鱼 双配置角色包验收</title><link rel="stylesheet" href="/src/visualPreview.css"><style>.panels{grid-template-columns:repeat(2,minmax(0,1fr));max-width:1120px}canvas{height:480px}.expressions{display:flex;gap:8px;flex-wrap:wrap}.expressions figure{margin:0;padding:8px;border:1px solid #c4d3d6;border-radius:8px;text-align:center}.expressions img{width:112px;height:139px}.expressions figcaption{font-size:12px}@media(max-width:850px){.panels{grid-template-columns:1fr}}</style></head><body>
<h1>大肥鱼 · 双配置角色包验收</h1><p>从 scripts/fixtures/dafeiyu-package.json 和已有大肥鱼四张 PNG 加载，复用正式 CharacterLoader、播放器和输入链路。左栏固定基准配置，右栏可切换测试配置。不会写入桌面 AppData 或调用真实 MCP。</p>
<div class="toolbar"><label>右栏服装 <select id="outfit"><option value="alternate">沉静配置</option><option value="primary">基准配置</option></select></label><label>键盘 <select id="layout"><option value="65">65 键</option><option value="108">108 键</option></select></label><label>朝向 <select id="orientation"><option value="cat">面向人物</option><option value="viewer">面向观众</option></select></label><label>缩放 <select id="scale"><option value="1">100%</option><option value="0.2">20%</option><option value="0.6">60%</option><option value="1.5">150%</option></select></label></div>
<div class="toolbar"><button id="typing">连续打字</button><button id="combo">鼠标＋键盘</button><button id="pet">往返抚摸</button><button id="privacy" aria-pressed="false">隐私模式</button><button id="release">释放输入</button><button id="retry">重新加载右栏</button><a href="/visual-sync-2d.html">同步验收</a><a href="/visual-2d.html">原版对比</a></div>
<p id="status" role="status">正在读取包与解码素材…</p>
<div class="panels"><section class="panel"><h2>基准配置 · 固定对照</h2><div class="stage"><canvas id="primary" tabindex="0" aria-label="大肥鱼基准预览"></canvas></div><pre id="primary-state"></pre></section><section class="panel"><h2 id="selected-title">便服 · 可切换</h2><div class="stage"><canvas id="selected" tabindex="0" aria-label="大肥鱼配置切换预览"></canvas></div><pre id="selected-state"></pre></section></div>
<p id="load-status" role="status"></p><h2>右栏服装的四种身体表情原图</h2><div id="expressions" class="expressions"></div>
<footer><p>仅复用内置大肥鱼素材测试加载、切换、动作和隐私；两种配置不是新人物或新美术。不会导入桌面数据，不代表原生 MCP 或系统输入验收。</p></footer>
<script type="module" src="/src/visualCharacterPack.ts"></script></body></html>
