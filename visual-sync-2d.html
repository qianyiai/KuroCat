<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>桌面与 OBS 状态同步验收</title><link rel="stylesheet" href="/src/visualPreview.css"><style>.panels{grid-template-columns:repeat(2,minmax(0,1fr));max-width:1120px}canvas{height:480px}@media(max-width:850px){.panels{grid-template-columns:1fr}}</style></head><body>
<h1>桌面／OBS 连续状态同步</h1><p>两端使用真实 PNG 和共享播放器，复用生产代码的快照发送器、接收校验和播放器状态消费。原生 IPC、SSE 用本页可控传输模拟，不连接桌面程序。</p>
<div class="toolbar"><label>动作配置 <select id="preset"><option value="dafeiyu">大肥鱼</option><option value="calm">沉静 · 无尾</option></select></label><label>传输延迟 <select id="latency"><option value="0">0 毫秒</option><option value="200">200 毫秒</option><option value="800">800 毫秒</option></select></label><button id="typing">连续打字</button><button id="pet">往返抚摸</button><button id="privacy" aria-pressed="false">隐私模式</button><button id="disconnect" aria-pressed="false">断开连接</button><button id="release">释放输入</button><a href="/visual-2d.html">返回原版对比</a></div>
<p id="status" role="status">正在解码素材…</p>
<div class="panels"><section class="panel"><h2>桌面端 · 状态来源</h2><div class="stage"><canvas id="desktop" tabindex="0" aria-label="桌面端人物"></canvas></div><pre id="desktop-state"></pre></section><section class="panel"><h2>OBS 端 · 跟随快照</h2><div class="stage"><canvas id="replica" tabindex="0" aria-label="OBS 端人物"></canvas></div><pre id="replica-state"></pre></section></div>
<footer><p>先抚摸或打字，比较两端的能量、情绪和反应；再增加延迟、断开重连，或在动作中切换配置及隐私。重连清理按住输入，不补播断线期间的按键。快照不包含键值、键名、按住列表或本地路径。</p><p>本页沿用大肥鱼图片作为运行测试夹具。<a href="/visual-character-pack.html">02 制服与便服真实包预览</a>已单独提供。粒子与手部物理仍由两端独立绘制，不承诺逐像素相等。</p></footer>
<script type="module" src="/src/visual2dSyncPreview.ts"></script></body></html>
