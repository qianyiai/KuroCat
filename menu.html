<!doctype html>
<html lang="zh-CN" class="menu-window-mode">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KuroCat Menu</title>
  </head>
  <body class="menu-window-body">
    <div id="context-menu" class="context-menu floating-side-menu tab-menu-layout scheme-a-menu">
      <!-- Top Bar -->
      <div class="menu-header-row">
        <div class="menu-header" id="menu-header">🐈‍⬛ KuroCat 小黑猫</div>
        <div class="menu-header-actions">
          <button
            class="header-icon-btn hidden"
            id="btn-header-admin"
            data-action="restart-admin"
            type="button"
            data-i18n-title="menu.admin_restart"
            title="以管理员身份重启（捕获游戏键鼠）"
            aria-label="Restart as Administrator"
          >
            <svg class="icon-shield" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"></path>
            </svg>
            <svg class="icon-shield-ok" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"></path>
              <path d="M9 12l2 2 4-4"></path>
            </svg>
          </button>
          <button
            class="header-icon-btn"
            id="btn-header-mute"
            data-action="toggle-mute"
            type="button"
            data-i18n-title="menu.mute_title"
            title="静音 / 取消静音"
            aria-label="Mute / Unmute"
            aria-pressed="false"
          >
            <svg class="icon-vol-on" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <svg class="icon-vol-muted" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="22" y1="9" x2="16" y2="15"></line>
              <line x1="16" y1="9" x2="22" y2="15"></line>
            </svg>
          </button>
          <button
            class="header-icon-btn"
            id="btn-header-lock"
            data-action="toggle-lock"
            type="button"
            data-i18n-title="menu.toggle_lock"
            title="锁定鼠标穿透（Alt 解锁）"
            aria-label="Click-through lock"
          >
            <svg class="icon-unlocked" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="11" width="16" height="10" rx="2.5"></rect>
              <path d="M8 11V7a4 4 0 0 1 7.6-1.7"></path>
            </svg>
            <svg class="icon-locked" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="11" width="16" height="10" rx="2.5"></rect>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
            </svg>
          </button>
          <button
            class="menu-close-btn"
            id="btn-close-menu"
            type="button"
            data-i18n-title="menu.close_title"
            title="关闭菜单 (Esc)"
            aria-label="Close"
          >
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M18 6L6 18M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- 3-Tab Segmented Bar -->
      <div class="menu-tabs menu-tabs-3" role="tablist" aria-label="Settings">
        <button class="menu-tab-btn active" data-tab="appearance" type="button" role="tab" aria-selected="true">
          <svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l1.9 4.6L19 9.5l-4.2 3.1L16 17.8 12 15l-4 2.8 1.2-5.2L5 9.5l5.1-1.9L12 3z"></path>
          </svg>
          <span data-i18n="menu.tab_looks">外观</span>
        </button>
        <button class="menu-tab-btn" data-tab="interact" type="button" role="tab" aria-selected="false">
          <svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="6" width="20" height="12" rx="2.5"></rect>
            <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"></path>
          </svg>
          <span data-i18n="menu.tab_interact">互动</span>
        </button>
        <button class="menu-tab-btn" data-tab="system" type="button" role="tab" aria-selected="false">
          <svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="7" x2="20" y2="7"></line>
            <circle cx="9" cy="7" r="2"></circle>
            <line x1="4" y1="17" x2="20" y2="17"></line>
            <circle cx="15" cy="17" r="2"></circle>
          </svg>
          <span data-i18n="menu.tab_sys">系统</span>
        </button>
      </div>

      <div class="tab-body" id="menu-tab-body">
        <!-- Tab 1: Appearance (Looks, Scale, Style) -->
        <div class="tab-panel" data-tab-panel="appearance">
          <!-- Card 1: Breeds (Collapsible) -->
          <section class="menu-card" id="breed-card">
            <div class="card-head breed-card-head">
              <button
                class="breed-collapse-head"
                id="btn-breed-collapse"
                type="button"
                aria-expanded="true"
                data-i18n-title="menu.breed_collapse_title"
                title="展开 / 折叠角色列表"
              >
                <span class="card-title-group">
                  <span class="card-title" data-i18n="menu.section_breed">角色外观</span>
                  <span class="breed-count-badge" id="breed-count">7</span>
                  <span class="breed-active-preview hidden" id="breed-active-preview"></span>
                  <svg class="breed-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"></path>
                  </svg>
                </span>
              </button>
              <button
                class="handover-switch"
                data-action="toggle-switch-animation"
                type="button"
                role="switch"
                aria-checked="true"
                id="sw-switch-animation"
              >
                <span data-i18n="menu.toggle_switch_animation">老吴换班</span>
                <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
              </button>
            </div>
            <div class="breed-chips" id="breed-pills"></div>
          </section>

          <!-- Card 2: Pet Scale & Opacity -->
          <section class="menu-card menu-card-sliders">
            <div class="card-head">
              <span class="card-title" data-i18n="menu.scale_label">尺寸缩放</span>
              <button
                class="scale-value-btn"
                id="scale-value"
                type="button"
                data-i18n-title="menu.scale_reset_title"
                title="点击复位 100%"
              >100%</button>
            </div>
            <div class="scale-slider-wrap">
              <input
                type="range"
                id="scale-slider"
                class="scale-slider"
                min="20"
                max="150"
                step="1"
                value="100"
              />
              <div class="scale-ticks">
                <span>20%</span>
                <span class="scale-tick-mid">100%</span>
                <span>150%</span>
              </div>
            </div>
            <div class="card-divider"></div>
            <div class="card-head">
              <span class="card-title" data-i18n="menu.opacity_label">不透明度</span>
              <button
                class="scale-value-btn"
                id="opacity-value"
                type="button"
                data-i18n-title="menu.opacity_reset_title"
                title="点击复位 100%"
              >100%</button>
            </div>
            <div class="scale-slider-wrap">
              <input
                type="range"
                id="opacity-slider"
                class="scale-slider"
                min="20"
                max="100"
                step="1"
                value="100"
              />
              <div class="scale-ticks">
                <span>20%</span>
                <span>100%</span>
              </div>
            </div>
          </section>

          <!-- Card 3: Style & Visual Engine (Single-row inline controls) -->
          <section class="menu-card" id="style-card">
            <div class="card-head">
              <span class="card-title" data-i18n="menu.section_style">装扮与画面</span>
            </div>

            <div class="setting-row" id="render-mode-row">
              <span class="setting-label" data-i18n="menu.render_mode_short">渲染模式</span>
              <div class="seg-control seg-2">
                <button
                  class="seg-btn active"
                  data-rendermode="3d"
                  data-i18n="menu.render_3d_short"
                  data-i18n-title="menu.render_3d_title"
                  type="button"
                  title="Three.js 真 3D 体积光影手办"
                >3D 立体</button>
                <button
                  class="seg-btn"
                  data-rendermode="2d"
                  data-i18n="menu.render_2d_short"
                  data-i18n-title="menu.render_2d_title"
                  type="button"
                  title="经典 2D 矢量手绘，极简省电"
                >2D 经典</button>
              </div>
            </div>

            <div class="setting-row" id="collar-row">
              <span class="setting-label" data-i18n="menu.collar_short">项圈铃铛</span>
              <div class="collar-swatches" role="radiogroup" aria-label="Collar color">
                <button class="collar-swatch swatch-none active" data-collar="none" data-i18n-title="menu.collar_none" title="无" aria-label="None" type="button"></button>
                <button class="collar-swatch swatch-red" data-collar="red" data-i18n-title="menu.collar_red" title="红" aria-label="Red" type="button"></button>
                <button class="collar-swatch swatch-blue" data-collar="blue" data-i18n-title="menu.collar_blue" title="蓝" aria-label="Blue" type="button"></button>
                <button class="collar-swatch swatch-pink" data-collar="pink" data-i18n-title="menu.collar_pink" title="粉" aria-label="Pink" type="button"></button>
                <button class="collar-swatch swatch-green" data-collar="green" data-i18n-title="menu.collar_green" title="绿" aria-label="Green" type="button"></button>
              </div>
            </div>

            <div class="setting-row" id="headphone-row">
              <span class="setting-label" data-i18n="menu.headphone_short">电竞耳机</span>
              <div class="seg-control seg-3">
                <button class="seg-btn active" data-headphonemode="off" data-i18n="menu.headphone_off" type="button">关闭</button>
                <button class="seg-btn" data-headphonemode="auto" data-i18n="menu.headphone_auto_short" type="button">自动</button>
                <button class="seg-btn" data-headphonemode="on" data-i18n="menu.headphone_on_short" type="button">常戴</button>
              </div>
            </div>
          </section>

          <!-- Card 4: Sound Volume, Mute & Typing SFX (visible on Tab 1 for all pets) -->
          <section class="menu-card menu-card-sliders" id="typing-sound-card">
            <div class="card-head">
              <div class="volume-head-left">
                <button
                  class="volume-mute-btn"
                  id="btn-volume-mute"
                  data-action="toggle-mute"
                  type="button"
                  data-i18n-title="menu.mute_title"
                  title="静音 / 取消静音"
                  aria-label="Mute / Unmute"
                  aria-pressed="false"
                >
                  <svg class="icon-vol-on" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                  </svg>
                  <svg class="icon-vol-muted" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="22" y1="9" x2="16" y2="15"></line>
                    <line x1="16" y1="9" x2="22" y2="15"></line>
                  </svg>
                </button>
                <span class="card-title" data-i18n="menu.volume_label">声音音量</span>
              </div>
              <button
                class="scale-value-btn"
                id="volume-value"
                type="button"
                data-i18n-title="menu.volume_reset_title"
                title="点击复位 100%"
              >100%</button>
            </div>
            <div class="scale-slider-wrap">
              <input
                type="range"
                id="volume-slider"
                class="scale-slider"
                min="0"
                max="100"
                step="1"
                value="100"
              />
            </div>
            <div class="card-divider"></div>
            <button class="toggle-row" data-action="toggle-typing-sound" type="button" role="switch" aria-checked="false" id="sw-typing-sound">
              <span class="toggle-label-wrap">
                <span class="toggle-label" data-i18n="menu.toggle_typing_sound">打字键鼠音效</span>
              </span>
              <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
            </button>
          </section>
        </div>

        <!-- Tab 2: Interaction (Zero-scroll collapsible cards) -->
        <div class="tab-panel hidden" data-tab-panel="interact">
          <!-- Card 1: Keyboard Layout & Orientation (Collapsible, default collapsed for zero-scroll Tab 2) -->
          <section class="menu-card collapsible-section is-collapsed" id="keyboard-card" data-collapse-card="keyboard">
            <button
              class="card-head section-collapse-head"
              data-collapse-toggle="keyboard"
              type="button"
              aria-expanded="false"
              data-i18n-title="menu.section_toggle_title"
              title="展开 / 折叠"
            >
              <span class="card-title-group">
                <span class="card-title" data-i18n="menu.section_kb_only">键盘设置</span>
                <span class="section-summary-pill" id="kb-summary-pill">65%</span>
              </span>
              <span class="card-head-right">
                <svg class="section-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M6 9l6 6 6-6"></path>
                </svg>
              </span>
            </button>
            <div class="section-collapse-body">
              <div class="seg-control seg-4">
                <button class="seg-btn active" data-kblayout="65" data-i18n="menu.kb_65_short" type="button">65%</button>
                <button class="seg-btn" data-kblayout="98" data-i18n="menu.kb_98_short" type="button">98 键</button>
                <button class="seg-btn" data-kblayout="108" data-i18n="menu.kb_108_short" type="button">108 键</button>
                <button class="seg-btn" data-kblayout="macbook" data-i18n="menu.kb_macbook" type="button">MacBook</button>
              </div>

              <div class="setting-row hidden" data-mac-finish>
                <span class="setting-label" data-i18n="menu.kb_finish">MacBook 配色</span>
                <div class="seg-control seg-2">
                  <button class="seg-btn active" data-finish="black" type="button" data-i18n="menu.kb_black">深空黑</button>
                  <button class="seg-btn" data-finish="white" type="button" data-i18n="menu.kb_white">银白色</button>
                </div>
              </div>

              <div class="setting-row">
                <span class="setting-label" data-i18n="menu.kb_orient_short">朝向视角</span>
                <div class="seg-control seg-2">
                  <button class="seg-btn active" data-kborient="cat" data-i18n="menu.kb_cat" type="button">面向猫咪</button>
                  <button class="seg-btn" data-kborient="viewer" data-i18n="menu.kb_viewer" type="button">面向观众</button>
                </div>
              </div>
            </div>
          </section>

          <!-- Card 2: Peripherals & Tail Patting (Collapsible, default collapsed) -->
          <section class="menu-card collapsible-section is-collapsed" id="peripherals-card" data-collapse-card="peripherals">
            <button
              class="card-head section-collapse-head"
              data-collapse-toggle="peripherals"
              type="button"
              aria-expanded="false"
              data-i18n-title="menu.section_toggle_title"
              title="展开 / 折叠"
            >
              <span class="card-title-group">
                <span class="card-title" data-i18n="menu.section_peripherals_tail">外设与尾巴</span>
                <span class="section-summary-pill" id="peripherals-summary-pill">智能第三只手</span>
              </span>
              <span class="card-head-right">
                <svg class="section-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M6 9l6 6 6-6"></path>
                </svg>
              </span>
            </button>
            <div class="section-collapse-body">
              <div class="setting-row hidden" data-pad-options>
                <span class="setting-label" data-i18n="menu.pointer">指点设备</span>
                <div class="seg-control seg-2">
                  <button class="seg-btn active" data-pointer="mouse" type="button" data-i18n="menu.mouse">鼠标</button>
                  <button class="seg-btn" data-pointer="trackpad" type="button" data-i18n="menu.trackpad">触控板</button>
                </div>
              </div>
              <span class="menu-hint hidden" data-pad-error data-i18n="menu.pad_unavailable">触点暂不可用，仍可显示点击反馈。</span>

              <div class="setting-row" id="tablet-row">
                <span class="setting-label" data-i18n="menu.tablet_short">数位板</span>
                <div class="seg-control seg-3">
                  <button class="seg-btn active" data-tabletmode="auto" data-i18n="menu.tablet_auto_short" type="button">自动</button>
                  <button class="seg-btn" data-tabletmode="mouse" data-i18n="menu.tablet_mouse_short" type="button">鼠标</button>
                  <button class="seg-btn" data-tabletmode="tablet" data-i18n="menu.tablet_on_short" type="button">常开</button>
                </div>
              </div>

              <div class="setting-row" id="gamepad-row">
                <span class="setting-label" data-i18n="menu.gamepad_short">游戏手柄</span>
                <div class="seg-control seg-3">
                  <button class="seg-btn active" data-gamepadmode="auto" data-i18n="menu.gamepad_auto_short" type="button">自动</button>
                  <button class="seg-btn" data-gamepadmode="off" data-i18n="menu.gamepad_off_short" type="button">关闭</button>
                  <button class="seg-btn" data-gamepadmode="on" data-i18n="menu.gamepad_on_short" type="button">常开</button>
                </div>
              </div>

              <div class="card-divider"></div>

              <div class="tail-section">
                <div class="card-head">
                  <span class="setting-label" data-i18n="menu.tail_label">尾巴拍键模式</span>
                  <span class="tail-mode-badge" id="tail-mode-badge">智能第三只手</span>
                </div>
                <div class="seg-control seg-4">
                  <button class="seg-btn active" data-tailmode="smart" data-i18n="menu.tail_smart" type="button">智能</button>
                  <button class="seg-btn" data-tailmode="custom" data-i18n="menu.tail_custom" type="button">自定义</button>
                  <button class="seg-btn" data-tailmode="edge" data-i18n="menu.tail_edge" type="button">边缘</button>
                  <button class="seg-btn" data-tailmode="off" data-i18n="menu.tail_off" type="button">关闭</button>
                </div>
                <button class="tail-pick-trigger hidden" data-action="open-tail-picker" id="btn-open-tail-picker" type="button">
                  <span data-i18n="menu.tail_pick_btn">🐾 在键盘上点选尾巴按键</span>
                  <span class="menu-hint" id="tail-keys-count">4 键</span>
                </button>
              </div>
            </div>
          </section>

          <!-- Card 3: Feed Cat Treat (Compact interactive card with illustrated flavor selector) -->
          <section class="menu-card treat-card" id="treat-card">
            <div class="card-head">
              <span class="card-title-group">
                <span class="card-title" data-i18n="menu.section_treat">投喂猫条</span>
              </span>
              <span class="treat-fed-badge hidden" id="treat-fed-badge"></span>
            </div>
            <div class="treat-flavor-grid" role="radiogroup" aria-label="Treat flavor">
              <button
                class="treat-flavor-card active"
                data-treatflavor="tuna"
                type="button"
                role="radio"
                aria-checked="true"
                data-i18n-title="menu.treat_flavor_tuna"
                title="金枪鱼"
              >
                <svg class="treat-flavor-art" viewBox="0 0 28 22" fill="none" aria-hidden="true">
                  <path d="M5.2 11.2C7.4 6.6 13.4 4.8 19.6 7.3C21.1 7.9 22.3 9.1 23.1 10.6C24.4 9.5 25.8 8.2 26.8 7.5C26.2 9.4 25.9 10.6 25.9 11.5C25.9 12.5 26.2 13.7 26.8 15.6C25.6 14.8 24.3 13.6 23.1 12.5C21.8 14.9 18.8 16.9 14.2 16.9C10.1 16.9 6.8 14.8 5.2 11.2Z" fill="#C84E57" stroke="#F6DDD9" stroke-width="0.9" stroke-linejoin="round"/>
                  <path d="M7.6 12.6C10.4 14.9 15.8 15.6 20.5 13.1C18.4 15.4 15.3 16.2 12.2 15.8C9.9 15.5 8.4 14.2 7.6 12.6Z" fill="#F5EFE4" opacity="0.92"/>

                <span data-i18n="menu.copy_obs_short">复制透明源地址</span>
                <span class="menu-hint" id="obs-copy-hint" data-i18n="menu.obs_hint">免抠像</span>
              </button>
              <button class="toggle-row sub-toggle-row" data-action="toggle-obs-hide" type="button" role="switch" aria-checked="false" id="sw-obs-hide">
                <span class="toggle-label" data-i18n="menu.obs_hide_pet">仅 OBS 显示（隐藏桌面猫）</span>
                <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
              </button>
              <div class="live-guide-hint" id="obs-sync-hint" data-i18n="menu.obs_sync_hint">桌面撸猫/戳猫与 Alt+Shift+1~6 同步至 OBS</div>
            </div>
          </section>

          <!-- Card 4: Live Companion Chroma Capture Window (Douyin / Huya / Bilibili / Kuaishou) -->
          <section class="menu-card collapsible-card" id="live-card">
            <button class="toggle-row card-toggle-head" data-action="toggle-live-capture" type="button" role="switch" aria-checked="false" id="sw-live">
              <span class="toggle-label-wrap">
                <svg class="section-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="2" y="4" width="20" height="14" rx="2.5"></rect>
                  <path d="M8 20h8M12 18v2"></path>
                </svg>
                <span class="toggle-label" data-i18n="menu.section_live">直播伴侣捕获窗</span>
              </span>
              <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
            </button>
            <div class="collapsible-body hidden" id="live-card-body">
              <div class="setting-row">
                <span class="setting-label" data-i18n="menu.live_chroma_label">幕布颜色</span>
                <div class="seg-control seg-3">
                  <button class="seg-btn active" data-livechroma="blue" type="button">
                    <span class="chroma-dot chroma-dot-blue" aria-hidden="true"></span>
                    <span data-i18n="menu.live_chroma_blue">蓝幕</span>
                  </button>
                  <button class="seg-btn" data-livechroma="green" type="button">
                    <span class="chroma-dot chroma-dot-green" aria-hidden="true"></span>
                    <span data-i18n="menu.live_chroma_green">绿幕</span>
                  </button>
                  <button class="seg-btn" data-livechroma="magenta" type="button">
                    <span class="chroma-dot chroma-dot-magenta" aria-hidden="true"></span>
                    <span data-i18n="menu.live_chroma_magenta">品红</span>
                  </button>
                </div>
              </div>
              <button class="toggle-row sub-toggle-row" data-action="toggle-live-hide" type="button" role="switch" aria-checked="false" id="sw-live-hide">
                <span class="toggle-label" data-i18n="menu.live_hide_pet">仅直播显示（隐藏桌面猫）</span>
                <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
              </button>
              <div class="live-guide-hint" data-i18n="menu.live_guide_hint">窗口捕获选 KuroCat Live → 开绿幕抠图</div>
            </div>
          </section>
        </div>
      </div>

      <!-- Fixed Bottom Footer -->
      <div class="tab-footer">
        <button class="footer-btn" data-action="check-update" id="btn-check-update" type="button">
          <span id="update-hint">检查更新 v5.1.3</span>
        </button>
        <button class="footer-btn danger" data-action="quit" data-i18n="menu.quit" type="button">退出</button>
      </div>
    </div>

    <script type="module" src="/src/menuMain.ts"></script>
  </body>
</html>
