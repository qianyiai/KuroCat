<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KuroCat OBS Browser Source</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
      }
      #obs-canvas,
      #obs-canvas-3d {
        display: block;
        width: 100vw;
        height: 100vh;
        background: transparent !important;
      }
      .hidden {
        display: none !important;
      }
      #obs-character-status {
        position: fixed;
        top: 8px;
        left: 8px;
        right: 8px;
        padding: 10px;
        border-radius: 8px;
        background: #752b2b;
        color: #fff;
        font: 13px/1.5 sans-serif;
        overflow-wrap: anywhere;
      }
      #obs-character-status[hidden] { display: none; }
      #obs-character-retry { margin-top: 6px; padding: 3px 10px; cursor: pointer; }
    </style>
  </head>
  <body>
    <canvas id="obs-canvas" aria-label="KuroCat OBS Transparent Source"></canvas>
    <canvas id="obs-canvas-3d" class="hidden" aria-label="KuroCat OBS 3D Transparent Source"></canvas>
    <div id="obs-character-status" role="status" hidden>
      <p id="obs-character-error"></p>
      <button id="obs-character-retry" type="button">重试人物加载</button>
    </div>
    <script type="module" src="/src/obsMain.ts"></script>
  </body>
</html>
