name: Build Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (Windows x64 - Standard 65% default)
        run: npm run tauri -- build --bundles msi,nsis

      - name: Rename Standard Windows release assets (setup.exe sorts #1 on GitHub Releases)
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { 'latest' }
          $ver = $tag.TrimStart('v')
          Copy-Item "src-tauri/target/release/KuroCat.exe" "KuroCat-$tag-windows-x64.exe"
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName "KuroCat-$ver-x64-setup.exe"
          }

      - name: Build Tauri app (Windows x64 - 108-Key Full-Size default)
        run: npm run tauri -- build --bundles nsis --features layout-108

      - name: Rename 108-Key Windows installer (sorts #2 right below Standard setup.exe)
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { 'latest' }
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName "KuroCat-$tag-108key-x64-setup.exe"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-windows-x64
          path: |
            KuroCat-*-x64-setup.exe
            KuroCat-*-108key-x64-setup.exe
            KuroCat-*-windows-x64.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish Windows assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KuroCat-*-x64-setup.exe
            KuroCat-*-108key-x64-setup.exe
            KuroCat-*-windows-x64.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable (Apple Silicon + Intel Universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Universal macOS .app
        run: npm run tauri -- build --target universal-apple-darwin --bundles app

      - name: Sign and package Universal macOS .dmg and .app.tar.gz
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v ]]; then TAG="latest"; fi
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/KuroCat.app"
          # Preserve a valid bundle signature if the build already provided one.
          if ! codesign --verify --strict --all-architectures -R '=identifier "com.kurocat.pet"' "$APP_PATH"; then
            codesign --force --sign - --identifier com.kurocat.pet "$APP_PATH"
          fi
          codesign --verify --strict --all-architectures -R '=identifier "com.kurocat.pet"' "$APP_PATH"
          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "KuroCat" -srcfolder dmg_staging -ov -format UDZO "KuroCat-${TAG}-macos-universal.dmg"
          tar -czf "KuroCat-${TAG}-macos-universal.app.tar.gz" -C "src-tauri/target/universal-apple-darwin/release/bundle/macos" "KuroCat.app"
          ls -lh "KuroCat-${TAG}-macos-universal.dmg" "KuroCat-${TAG}-macos-universal.app.tar.gz"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-macos-universal
          path: |
            KuroCat-*-macos-universal.dmg
            KuroCat-*-macos-universal.app.tar.gz

      - name: Publish macOS assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KuroCat-*-macos-universal.dmg
            KuroCat-*-macos-universal.app.tar.gz
